<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: 'Segoe UI', Calibri, Arial, sans-serif;
      background-color: #1b2c4f;
      color: #ffffff;
      position: relative;
      padding: 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .accent-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 8px;
      background: #4a9eff;
    }

    .label {
      font-size: 11pt;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #7ab4ff;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 40pt;
      font-weight: 700;
      line-height: 1.2;
      color: #ffffff;
    }

    .divider {
      width: 60px;
      height: 4px;
      background: #4a9eff;
      margin: 28px 0;
    }

    .courses {
      font-size: 12pt;
      color: #a8c4e8;
      line-height: 2.4;
    }

    .courses strong {
      color: #ddeeff;
    }

    .year {
      position: absolute;
      bottom: 40px;
      right: 60px;
      font-size: 10pt;
      color: #6a8ab0;
    }
  </style>
</head>
<body>
  <div class="accent-top"></div>

  <div class="label">Material de Referencia</div>

  <h1>Algoritmos y<br>Estructuras de Datos</h1>

  <div class="divider"></div>

  <div class="courses">
    <strong>CE-1103</strong> · Algoritmos y Estructuras de Datos<br>
    <strong>CE-2103</strong> · Diseño y Análisis de Algoritmos
  </div>

  <div class="year">2025</div>
</body>
</html>
